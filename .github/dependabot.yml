# Dependabot config — modeled after trufflesecurity/trufflehog's
# automated dependency-update setup (they use renovate.json; same job here).
version: 2
updates:
  # Python dependencies (requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    groups:
      torch:
        patterns:
          - "torch*"
      google:
        patterns:
          - "google-*"
      qt:
        patterns:
          - "PyQt6*"

  # Keep GitHub Actions pinned & fresh
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
